<!DOCTYPE html>

<head>
<style>

*{box-sizing:border-box;margin:0;padding:0;}
.container{width:1024px;margin:0 auto;}
header{background-image:url(images/header.jpg);height:256px;}
nav{background-color:Red;height:400px;flex:2;}
article{background-color:Grey;height:400px;flex:5;}
footer{background-color:Blue;padding:25px;text-align:center;color:#ddd;}
section{display:flex}
a:link{
    color:green;
    background-color: purple;
    text-decoration:none;
    display:block;
    width:150px;
    padding:5px;
}
a:visited{
    color:pink;
    background-color:transparent;
    text-decoration:none;

}
a:hover{
    color:red;
    background-color:yellow;
    text-decoration:none;

}
a:active{
    color:yellow;
    background-color:transparent;
    text-decoration:none;

}

</style>

<meta charset="utf-8">
<title>work8 html layout</title>
</head>
<body>

<div class="container">
<header></header>
<section>
<nav></nav>
<article></article>
</section>
<footer><p>จัดทำโดยนายชัยนันท์ ผมหอม ชั้น ม.6/9 เลขที่ 2 <br>โรงเรียนรัตนราษฎร์บำรุง</p></footer>
